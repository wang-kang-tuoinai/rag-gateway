<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ops Agent - RAG Gateway</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Markdown, DOMPurify & Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a10 10 0 1 0 10 10H12V2z"></path>
              <path d="M12 12L2.5 4.5"></path>
              <path d="M12 12v10"></path>
            </svg>
          </div>
          <span class="brand-name">Ops RAG Bot</span>
        </div>
        <button id="new-chat-btn" class="btn-new-chat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          新建会话
        </button>
      </div>

      <div class="history-section">
        <div class="section-title">历史会话 (History)</div>
        <ul id="history-list" class="history-list">
          <!-- Dynamically populated history items -->
        </ul>
        <button id="load-more-btn" class="btn-load-more" style="display: none;">
          加载更多...
        </button>
      </div>

      <div class="sidebar-footer">
        <div class="status-indicator">
          <span class="dot online"></span> Gateway Connected
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Navigation -->
      <header class="top-bar">
        <div class="conversation-info">
          <h2 id="current-chat-title">新会话</h2>
          <span id="current-chat-id" class="chat-id-badge">ID: new</span>
        </div>
      </header>

      <!-- Message History Display Area -->
      <div id="messages-container" class="messages-container">
        <div class="welcome-screen" id="welcome-screen">
          <div class="welcome-icon">⚡</div>
          <h1>欢迎使用 Ops Agent 智能问答系统</h1>
          <p>基于 RAG (检索增强生成) 架构，快速准确回答您的技术与运维问题。</p>
          <div class="example-prompts">
            <button class="prompt-chip" data-prompt="Go接口命名规范是什么？">
              💡 Go接口命名规范是什么？
            </button>
            <button class="prompt-chip" data-prompt="Go语言iota是什么用法？">
              💡 Go语言iota是什么用法？
            </button>
            <button class="prompt-chip" data-prompt="如何配置 OpenTelemetry 链路追踪？">
              💡 如何配置 OpenTelemetry 链路追踪？
            </button>
          </div>
        </div>
      </div>

      <!-- Input Area -->
      <div class="input-container">
        <form id="chat-form" class="chat-form">
          <textarea id="user-input" placeholder="输入您的问题 (Press Enter to send, Shift+Enter for new line)..." rows="1" required></textarea>
          <button type="submit" id="send-btn" class="btn-send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>
        <div class="input-footer">
          <span>Powered by Ops-Agent RAG Gateway • Port 8081</span>
        </div>
      </div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
