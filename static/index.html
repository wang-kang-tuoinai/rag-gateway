<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ops Agent · 运维诊断</title>
  <link rel="stylesheet" href="/static/style.css">
  <script defer src="/static/vendor/marked.umd.js"></script>
  <script defer src="/static/vendor/purify.min.js"></script>
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="/" aria-label="Ops Agent 首页"><span class="brand-mark">O↗</span><div>Ops Agent<small>运维诊断工作台</small></div></a>
    <button class="new-chat" id="new-chat">＋ 新建诊断</button>
    <div class="section-label">最近对话 <button id="refresh-list" class="text-button" aria-label="刷新会话列表">刷新</button></div>
    <p class="sidebar-notice" id="list-notice" role="status"></p>
    <nav id="conversation-list" aria-label="历史会话"></nav>
    <button class="text-button more-list" id="more-list" hidden>加载更多会话</button>
    <div class="sidebar-footer"><span class="small-mark">◈</span><div>从现象到证据<small>日志 · 链路 · 运维知识</small></div></div>
  </aside>
  <main>
    <header class="topbar"><button class="menu-button" id="menu" aria-label="展开会话列表" aria-expanded="false">☰</button><div><span class="eyebrow">诊断会话</span><h1 id="conversation-title">新建诊断</h1></div><span class="top-tag">只读观测</span></header>
    <div class="notice" id="notice" role="status" hidden><span id="notice-text"></span><button class="text-button" id="retry" hidden>重试本次提交</button><button class="text-button" id="check-run" hidden>刷新执行状态</button></div>
    <section class="viewport" id="viewport" aria-label="诊断消息"><div class="chat-width">
      <button class="older-button" id="older" hidden>加载更早的对话</button>
      <div id="welcome" class="welcome"><div class="welcome-symbol">⌁</div><span class="eyebrow">OBSERVE · INVESTIGATE · EXPLAIN</span>
        <h2>让每一次诊断，<br>都有据可循。</h2><p>描述问题和时间范围，Agent 会结合日志、调用链与知识库，逐步排查异常。</p>
        <div class="suggestions">
          <button data-prompt="请检查这个时间窗口是否有异常：开始时间……，结束时间……。先汇总日志和链路，再下钻典型请求。"><span>01 / 异常概览</span><strong>这个窗口发生了什么？</strong><small>从日志和链路统计开始 ↗</small></button>
          <button data-prompt="请排查 GET /api/v1/users/:id 的慢请求，时间范围是……。分析耗时主要出现在哪些调用环节。"><span>02 / 链路排查</span><strong>请求为什么变慢了？</strong><small>定位耗时与异常 Span ↗</small></button>
          <button data-prompt="请查询项目知识库：Redis 读取缓存超时时，GET 用户详情接口如何降级？PUT 更新接口会受到什么影响？"><span>03 / 项目知识</span><strong>Redis 超时会影响什么？</strong><small>核对降级与加锁行为 ↗</small></button>
        </div>
      </div><div id="runs"></div>
    </div></section>
    <div class="composer-area"><button id="latest" class="latest" hidden>↓ 回到最新</button><form id="chat-form" class="composer"><textarea id="question" rows="2" maxlength="10000" placeholder="描述故障现象，或提供需要排查的时间范围…" aria-label="诊断问题" required></textarea><div class="composer-bottom"><span id="composer-hint">Enter 发送 · Shift + Enter 换行</span><button type="button" id="stop" class="stop-button" hidden>■ 停止生成</button><button type="submit" id="send" class="send-button">开始诊断 ↑</button></div></form><p class="footnote">结论以观测证据为准，执行操作前请核实。刷新或关闭页面会中止本页正在生成的诊断。</p></div>
  </main>
  <dialog id="reference-dialog"><div class="dialog-header"><span class="eyebrow">知识来源</span><button id="close-reference" class="text-button" aria-label="关闭知识来源">✕</button></div><h2 id="reference-title"></h2><p id="reference-meta"></p><a id="reference-link" target="_blank" rel="noopener noreferrer" hidden>打开原文 ↗</a><div id="reference-content" class="markdown"></div></dialog>
</body>
</html>
